FASE 1: MVP de Validación Rápida (1 Semana - Costo Inversión $\$0\text{ USD}$)Meta Principal: Montar el flujo completo de telemetría en tiempo real: que un celular transmita desde una calle del Quindío y cualquier persona lo vea moverse en vivo en su pantalla sobre un mapa gratuito.Entregables Técnicos:Backend Base:Servidor Node.js (Fastify o Express con TypeScript).Conexión a base de datos PostgreSQL con extensión PostGIS activa.Servidor WebSocket (Socket.io) para transmisión de coordenadas bidireccional.Frontend Conductor (PWA):Vista táctil /conductor con botón de inicio de ruta.Uso de navigator.geolocation.watchPosition con precisión alta (enableHighAccuracy: true).Activación de navigator.wakeLock para mantener la pantalla encendida.Frontend Ciudadano (PWA):Vista web /ciudadano con mapa interactivo centrado en el municipio mediante Leaflet.js y teselas de OpenStreetMap (sin API Keys de Google).Marcador de camión animado que actualiza su posición según los eventos recibidos del WebSocket.Dashboard de Emergencia / Demo:Vista /admin de una sola pantalla con el mapa global para mostrar al Alcalde o Gerente de EPQ en la reunión.Criterio de Éxito de la Fase: Realizar un recorrido de prueba en carro o moto transmitiendo señal continua durante 20 minutos sin desconexión y visualizándolo desde otro celular mediante un enlace o código QR.FASE 2: Inteligencia Geoespacial, Geocercas y Alertas (Semanas 2 y 3)Meta Principal: Automatizar el sistema de proximidad para avisar a la gente con 10 minutos de anticipación y permitir el registro de hogares.Entregables Técnicos:Módulo de Inmuebles Ciudadanos:El usuario fija un punto en el mapa (su casa o local) y le asigna un nombre.La base de datos almacena el punto como GEOMETRY(Point, 4326) en la tabla inmuebles_ciudadanos.Motor de Detección de Proximidad en PostGIS:Algoritmo de geocerca dinámica: cada vez que el camión reporta coordenadas, el servidor ejecuta una consulta ST_DWithin para identificar los inmuebles que se encuentran en la ventana estimada de aproximación (radio dinámico entre 500 y 1.000 metros según la velocidad promedio del vehículo).Mecanismo de Notificación:Integración de la Web Push API en la PWA con Service Workers para navegadores compatibles (Android y navegadores de escritorio).Alerta sonora/visual in-app para usuarios con la aplicación abierta en el navegador móvil.Programación de Rutas y Horarios:Carga de archivos GeoJSON/KML con las rutas oficiales de recolección de los barrios piloto.Vista de consulta ciudadana: "En tu sector la recolección opera: Lunes, Miércoles y Viernes de 7:00 PM a 10:00 PM".Criterio de Éxito de la Fase: Al simular o ejecutar la ruta, los celulares de los usuarios registrados en ese sector reciben la alerta de aproximación antes de que el vehículo pase frente a su punto fijado.FASE 3: Módulo Cívico (PQRS), Panel EPQ y Auditoría (Semanas 4 y 5)Meta Principal: Dotar al sistema de valor administrativo e institucional para justificar la contratación comercial con EPQ y la Alcaldía.Entregables Técnicos:Bandeja de PQRS Fotográfico Ciudadano:Formulario de reporte con selector de categoría ("Camión omitió cuadra", "Basura dispersa", "Escombros clandestinos").Acceso directo a la cámara del dispositivo (<input type="file" accept="image/*" capture="environment">) con incrustación obligatoria de coordenadas GPS tomadas en ese instante.Subida de imágenes optimizada a almacenamiento en la nube (ej. S3 / Cloudflare R2 / MinIO local) con compresión WebP en el cliente.Dashboard Integral para EPQ / Alcaldía:Módulo de monitoreo histórico: selector de fecha y camión para reproducir el recorrido completo de cualquier día anterior (playback de ruta).Módulo de fiscalización de tiempos: detección de paradas superiores a 15 minutos fuera de puntos de acopio o talleres autorizados.Tablero Kanban para gestión de quejas: Recibida $\rightarrow$ En Verificación $\rightarrow$ Cuadrilla Asignada $\rightarrow$ Cerrada con Evidencia.Mapa de calor (Heatmap Layer en Leaflet) para identificar visualmente las esquinas donde se concentran los botaderos no autorizados.Criterio de Éxito de la Fase: Presentar un informe técnico en PDF exportado desde el dashboard que demuestre tiempos de recolección, cumplimiento de trazado y resolución de incidencias ciudadanas.FASE 4: Transición a Flutter Nativo y Contratación Institucional (Fase de Escalamiento)Meta Principal: Llevar las aplicaciones del Ciudadano y del Conductor a las tiendas oficiales (Google Play y App Store) utilizando Flutter, financiado mediante el contrato oficial con la entidad pública.Entregables Técnicos:App Móvil Nativa Unificada en Flutter (Dart):Un único repositorio móvil que contiene el rol Ciudadano y el rol Conductor.Renderizado cartográfico nativo con flutter_map (manteniendo el consumo gratuito de OpenStreetMap).Servicio en Segundo Plano Nativo para el Conductor:Implementación de Foreground Services en Android y Background Location en iOS (geolocator / background_locator_2).El camión sigue transmitiendo coordenadas fluidamente aunque el conductor bloquee la pantalla del teléfono o conteste una llamada.Notificaciones Push Nativas Confiables:Integración de Firebase Cloud Messaging (FCM) y Apple Push Notification service (APNs).Notificaciones 100% garantizadas en dispositivos iOS sin depender de si el usuario guardó la web en su pantalla de inicio.Traspaso de Cuentas y Formalización:Registro de la cuenta Apple Developer para entidades públicas a nombre de EPQ o de la Alcaldía ($\$99\text{ USD/año}$, con posibilidad de exención de tarifas de Apple para entidades de gobierno).Registro de la cuenta Google Play Console a nombre de la entidad ($\$25\text{ USD}$ pago único).El Dashboard de administración se mantiene en la web (React), ya que los coordinadores operan desde computadores de oficina.4. Estructura de Datos y Contratos de ComunicaciónContrato de Telemetría (Payload WebSocket del Conductor)Emitido cada 5 segundos hacia el evento telemetria:posicion:{
