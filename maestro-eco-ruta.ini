Pilar 1: Plataforma Ciudadana (Cliente / Vecino)Objetivo: Eliminar la incertidumbre del horario de recolección y erradicar las basuras en la calle antes de tiempo.Componentes Clave:Visualizador de Recolección en Directo: Mapa interactivo con OpenStreetMap. Muestra el icono del camión moviéndose en tiempo real, el recorrido que ya realizó (línea gris) y el recorrido pendiente (línea verde o azul).Gestión Multi-Inmueble: El usuario registra diferentes puntos de su interés (ej. "Mi Casa", "El Negocio del Centro", "Casa de mis Padres"). Cada inmueble se asocia a su respectiva ruta y horario sin necesidad de reconfigurar la app.Sistema de Alertas de Proximidad: Notificación en pantalla: "Tu camión de recolección está a 10 minutos de tu punto de acopio. Es momento de sacar tus residuos."Módulo de Denuncia / PQRS Cívico: Formulario ágil para reportar fallas:El camión pasó y no recogió.Basura regada o animales dispersando desechos.Escombros clandestinos.Restricción técnica: Solo permite captura de fotografía mediante la cámara en tiempo real con metadatos de geolocalización forzados, evitando imágenes fraudulentas de archivo.Pilar 2: Plataforma del Conductor (Operativa / Móvil)Objetivo: Convertir cualquier teléfono de gama básica con plan de datos en un dispositivo de telemetría profesional sin compras de hardware GPS costoso.Componentes Clave:Acceso Rápido por Turno: Inicio de sesión simplificado (PIN de 4 dígitos o selección de vehículo en lista desplegable: Compactador C-02 + Ruta Nocturna Comuna 1).Control Operativo Unificado: Tres estados de alta visibilidad para usar con un solo toque:[ Iniciar Recorrido ]: Activa el GPS de alta precisión y abre la conexión WebSocket.[ Pausa Operativa ]: Permite seleccionar motivo (Tráfico denso, Falla mecánica, Descarga en relleno sanitario).[ Finalizar Turno ]: Cierra la ruta, calcula el kilometraje total y desactiva el GPS.Screen Wake Lock API: Impide que la pantalla del celular se apague mientras está en el soporte del parabrisas, evitando que el navegador suspenda la ejecución de JavaScript en segundo plano durante la PWA.Resiliencia ante Pérdida de Cobertura (Offline Sync): Si el camión entra en un cañón topográfico o zona sin 4G, las coordenadas se almacenan localmente en IndexedDB. Al recuperar la señal, se transmiten en ráfaga ordenada al servidor sin perder el historial.Pilar 3: Dashboard para EPQ y Alcaldía (Supervisión y Control)Objetivo: Dotar a la gerencia de EPQ y a las secretarías de gobierno/planeación de un centro de comando para auditar la operación y sustentar el servicio ante los entes reguladores.Componentes Clave:Torre de Control de Flota: Visualización simultánea en pantalla gigante o computador de todos los camiones activos en el departamento o municipio, identificando velocidad, rumbo, estado (en marcha, detenido, en ralentí excesivo).Auditoría de Recorrido y Cumplimiento: Contraste automático entre la Ruta Planificada (GeoJSON oficial) y la Ruta Real Ejecutada (Telemetría del camión). Identifica desvíos o sectores que el conductor dejó sin visitar.Mapa de Calor de Incidentes (PQRS): Georreferenciación de quejas ciudadanas. Si en una esquina específica del centro se reciben 15 reportes de basura acumulada en el mes, el sistema lo marca en rojo crítico para programar un contenedor comunal o una cuadrilla de barrido extra.Informes Normativos para la SSPD: Exportación de reportes de tiempos de inicio, finalización, velocidades de operación y volumen de incidencias resueltas para sustentar el Plan de Gestión Integral de Residuos Sólidos (PGIRS).3. Plan de Desarrollo por Fases Incrementales[ FASE 1: MVP Funcional ] ──> [ FASE 2: Inteligencia Geoespacial ] ──> [ FASE 3: Control EPQ/Alcaldía ] ──> [ FASE 4: Nativo Flutter ]
