Plan Maestro y Especificación Técnica: Plataforma de Gestión y Telemetría de Residuos SólidosProyecto: Ecosistema Digital de Monitoreo de Aseo Urbano en Tiempo RealMercado Objetivo: Empresas Públicas del Quindío (EPQ), Alcaldías Municipales (Quindío, Chocó y expansión regional)Filosofía de Arquitectura: Desarrollo Incremental Ágil (PWA de validación rápida $\rightarrow$ Flutter Multiplataforma Nativo $\rightarrow$ Dashboard Administrativo Web permanente).1. El Núcleo Tecnológico: ¿Por qué PostGIS y para qué sirve?Una base de datos relacional estándar (como MySQL o PostgreSQL convencional) solo entiende números y cadenas de texto. Si guardas la latitud 4.5389 y la longitud -75.6721, para la base de datos son dos números decimales aislados; no sabe qué es "distancia", qué es una "curva", ni qué es un "barrio".La limitación sin PostGIS (El cuello de botella)Si tienes $3.000$ familias registradas en un municipio y un camión transmite su ubicación cada 5 segundos:Sin PostGIS, tu servidor en Node.js tendría que recorrer las $3.000$ casas una por una en un bucle (for), calculando la distancia matemática (fórmula de Haversine) contra las coordenadas del camión:$$\text{Operaciones por minuto} = 3000 \times 12 = 36.000 \text{ cálculos trigonométricos por camión}$$Con 4 camiones activos simultáneamente, el servidor colapsa por uso excesivo de CPU y la latencia sube drásticamente.La solución con PostGIS (Motor Geoespacial Especializado)PostGIS convierte a PostgreSQL en un motor cartográfico inteligente mediante Índices Geoespaciales (GIST).PostGIS indexa las coordenadas como geometrías reales en la superficie de la Tierra y permite:Detección Instantánea de Cercanía (ST_DWithin):Permite preguntar a la base de datos: "¿Cuáles usuarios están a menos de 800 metros de este camión?". PostGIS resuelve la consulta en menos de $3\text{ ms}$ utilizando árboles espaciales, sin recorrer toda la tabla:SELECT u.id, u.endpoint_push
FROM inmuebles_ciudadanos ic
JOIN usuarios u ON u.id = ic.usuario_id
WHERE ST_DWithin(
    ic.geometria, 
    ST_SetSRID(ST_MakePoint(:longitud_camion, :latitud_camion), 4326)::geography, 
    800 -- Radio dinámico de proximidad en metros
);
Geocercas de Barrios y Cuadrantes (ST_Contains):Permite cargar el polígono oficial de un barrio (ej. Barrio Bolívar o Sector Centro) y determinar automáticamente si el camión ya entró o salió de ese sector geográfico:SELECT nombre_barrio 
FROM cuadrantes_recoleccion 
WHERE ST_Contains(geometria_barrio, ST_SetSRID(ST_MakePoint(:lng, :lat), 4326));
Cálculo de cobertura de ruta (ST_LineLocatePoint):Determina con exactitud qué porcentaje de la calle o del trazado oficial ya fue completado por el vehículo, detectando si el camión omitió un tramo programado.2. Los Tres Pilares del EcosistemaLa plataforma se compone de tres interfaces especializadas conectadas a un backend único:                                  ┌─────────────────────────────────────────────────────────┐
